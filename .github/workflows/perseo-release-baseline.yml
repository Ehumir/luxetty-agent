name: PERSEO release baseline

on:
  pull_request:
  push:
    branches:
      - main
      - "sprint0-release-baseline-*"

jobs:
  release-identity-gate:
    name: G0 release identity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PERSEO_RELEASE_GIT_SHA: ${{ github.sha }}
      PERSEO_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
      PERSEO_RELEASE_VERIFY_MODE: ci
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Release manifest contract
        run: npm run test:release

      - name: Verify current-head release identity
        run: npm run verify:release-manifest

      - name: Assert CI is testing the checked-out SHA
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$PERSEO_RELEASE_GIT_SHA"
          echo "Certified CI SHA: $ACTUAL_SHA"

  baseline-regression-observation:
    name: Diagnostic regression baseline (non-certifying)
    needs: release-identity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Inert values only so legacy unit modules can construct SDK clients during import.
      # They are deliberately non-production; network-backed behavior is not certified by this job.
      OPENAI_API_KEY: test-only-not-a-real-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-only-not-a-real-service-role-key
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: PERSEO regression observation
        id: perseo
        continue-on-error: true
        run: npm run test:perseo

      - name: ARGOS regression observation
        id: argos
        continue-on-error: true
        run: npm run test:argos

      - name: Publish diagnostic outcomes
        if: always()
        shell: bash
        run: |
          {
            echo "## Sprint 0 diagnostic regression baseline"
            echo ""
            echo "This job is intentionally non-certifying. A failure here remains release debt and must not be represented as PASS."
            echo ""
            echo "- PERSEO regression outcome: ${{ steps.perseo.outcome }}"
            echo "- ARGOS regression outcome: ${{ steps.argos.outcome }}"
            echo "- Frozen observed PERSEO baseline: 155/157 passed, 2 failed, 0 skipped"
            echo "- Final PCR-1 certification still requires the release matrix to pass with no skipped/XFAIL/not_run."
          } >> "$GITHUB_STEP_SUMMARY"
